# Checks the content and builds the site on every push and pull request.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every entry as Mica and the website read it: fields, media, links and layout.
      - run: npx mica check
      - run: npm run build
      # The build writes the model. A difference means that src/mica.ts changed and content/.mica/schema.json was not committed.
      - run: git diff --exit-code content/.mica/schema.json
