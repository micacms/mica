# A complete Mica, end to end, on your machine.
#
#   docker compose -f tests/e2e/compose.yml up --build
#
# Then open http://localhost:6422/admin/ and sign in as alice / alice.
#
# This exercises what the unit tests cannot: a real OpenID Connect round trip
# through a real identity provider, with the CMS running from the image rather
# than from source.
#
# Three accounts, chosen to make the outcomes visible:
#
#   alice / alice        in the `mica-editors` group, and therefore an editor
#   bob / bob            in the same group, and therefore the same. There is no
#                        role to tell them apart: everybody admitted is an
#                        editor of this site
#   mallory / mallory    authenticates perfectly and is refused, because she is
#                        in no group Mica was told to admit
#
# Mallory is the point. Authentication and admission are separate questions,
# and this is where you can watch that be true. Note where the answer lives:
# alice and bob are editors because of a group in Keycloak, not because of a
# row in Mica — there is no user table, and no People screen.
#
# Everything here is deliberately insecure and deliberately local: plain HTTP,
# a committed client secret, one-word passwords. It is a test rig.

name: mica-e2e

services:
  # ------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Mica and your browser must reach the issuer at the *same* URL, or the
      # `iss` claim will not match what discovery returned. Both use
      # localhost:8080, so Keycloak has to believe that is its own address.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

    # Both ports are published here, including Mica's 6422. The CMS shares this
    # container's network namespace (see `network_mode` below), so this is the
    # only place either port can be exposed from.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6422:6422"

    healthcheck:
      # The realm's discovery document, which is the thing Mica actually needs
      # — a better signal than an open port. The image has no curl, so this
      # goes through bash's /dev/tcp.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/mica/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # ---------------------------------------------------------------- mica
  mica:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy

    # Shares Keycloak's network namespace, so `localhost:8080` means the same
    # thing inside this container as it does in your browser. Without that the
    # issuer Mica discovers and the issuer the browser is redirected to would
    # be different strings, and the ID token's `iss` check would fail.
    network_mode: "service:keycloak"

    environment:
      # Development, deliberately, and the one thing here that is not
      # production-shaped. Mica refuses plain-HTTP OIDC discovery when
      # NODE_ENV=production — correctly, since an ID token over http is an ID
      # token anyone on the path can read. Giving Keycloak a certificate is
      # more machinery than a local test rig deserves, so the rig relaxes the
      # one flag rather than the rule.
      #
      # What is being tested is the self-hosted composition: real provider, real
      # redirect, real admission check against a real group claim.
      NODE_ENV: development
      LOG_LEVEL: debug

      MICA_PUBLIC_URL: http://localhost:6422

      MICA_OIDC_ISSUER: http://localhost:8080/realms/mica
      MICA_OIDC_CLIENT_ID: mica
      MICA_OIDC_CLIENT_SECRET: e2e-client-secret-not-for-production

      # Who may edit. The realm puts alice and bob in this group and leaves
      # mallory out of it, so this one line is the whole of authorization —
      # there is nothing to bootstrap and nobody to invite.
      MICA_ADMIT_GROUP: mica-editors

      # A checkout, mounted read-write, so `git diff` on the host shows exactly
      # what an editor changed. That is the demonstration.
      REPOSITORY: local
      CONTENT_ROOT: /content

      SESSION_SECRET: e2e-session-secret-0000000000000000

    volumes:
      # The example project's content, mounted read-write, so `git diff` on the
      # host shows exactly what an editor changed. The content model comes from
      # `.mica/schema.json` inside it — there is nothing else to mount.
      - ../../examples/muster-consulting/content:/content
      - mica-data:/data

volumes:
  mica-data:
