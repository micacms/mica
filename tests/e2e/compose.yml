# A complete Mica, end to end, on your machine.
#
#   docker compose -f tests/e2e/compose.yml up --build
#
# Then open http://localhost:6422/admin/ and sign in as alice / alice.
#
# A real OpenID Connect round trip through a real identity provider, with the CMS
# running from the image rather than from source.
#
#   alice / alice        in the `mica-editors` group, and therefore an editor
#   bob / bob            in the same group; there are no roles, so the same
#   mallory / mallory    authenticates and is refused: she is in no admitted group
#
# Authentication and admission are separate questions; mallory shows it.
#
# Deliberately insecure and local: plain HTTP, a committed client secret, one-word passwords.

name: mica-e2e

services:
  # ------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Mica and your browser must reach the issuer at the *same* URL, or the
      # `iss` claim will not match what discovery returned. Both use
      # localhost:8080, so Keycloak has to believe that is its own address.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

    # Mica's and Forgejo's ports are published here too: they share this container's
    # network namespace, so this is the only place to expose them from.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6422:6422"
      - "127.0.0.1:3000:3000"

    healthcheck:
      # The realm's discovery document, which is the thing Mica actually needs
      # — a better signal than an open port. The image has no curl, so this
      # goes through bash's /dev/tcp.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/mica/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # ---------------------------------------------------------- repository
  # A real Git host, seeded with the example content by the same script as
  # tests/oidc. Plain HTTP on localhost, which Mica accepts only in development.
  forgejo:
    image: data.forgejo.org/forgejo/forgejo:15.0.9
    network_mode: "service:keycloak"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__log__LEVEL: Warn
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/version"]
      interval: 2s
      timeout: 2s
      retries: 60

  forgejo-seed:
    image: data.forgejo.org/forgejo/forgejo:15.0.9
    network_mode: "service:keycloak"
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/seed.sh"]
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_PASSWORD: Forgejo-test-password-not-for-production
    volumes:
      - forgejo-data:/data
      - ../oidc/forgejo-seed.sh:/seed.sh:ro
      - ../../examples/muster-consulting/content:/seed:ro

  # ---------------------------------------------------------------- mica
  mica:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      forgejo-seed:
        condition: service_completed_successfully

    # Shares Keycloak's network namespace, so `localhost:8080` means the same issuer
    # here as in your browser, and the ID token's `iss` check passes.
    network_mode: "service:keycloak"

    environment:
      # Development, on purpose: Mica refuses plain-HTTP OIDC discovery under
      # NODE_ENV=production, and a certificate for Keycloak is too much for a test rig.
      NODE_ENV: development
      MICA_LOG_LEVEL: debug

      MICA_PUBLIC_URL: http://localhost:6422

      MICA_OIDC_ISSUER: http://localhost:8080/realms/mica
      MICA_OIDC_CLIENT_ID: mica
      MICA_OIDC_CLIENT_SECRET: e2e-client-secret-not-for-production

      # The realm puts alice and bob in this group and leaves mallory out.
      MICA_ADMIT_GROUPS: mica-editors

      # Mica clones and pushes to Forgejo (the user `editor`, password below);
      # read what arrived at http://localhost:3000/editor/site.
      MICA_REPOSITORY_URL: http://localhost:3000/editor/site.git
      MICA_REPOSITORY_USERNAME: editor
      MICA_REPOSITORY_TOKEN: Forgejo-test-password-not-for-production

      MICA_SESSION_SECRET: e2e-session-secret-0000000000000000

    volumes:
      - mica-data:/data

volumes:
  mica-data:
  forgejo-data:
