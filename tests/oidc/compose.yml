# The automated OIDC test: the real Mica image against a real Dex, publishing
# to a stand-in for the GitHub API.
#
#   docker compose -f tests/oidc/compose.yml up -d --build --wait
#   node --test tests/oidc/flow.test.mjs
#   docker compose -f tests/oidc/compose.yml down
#
# CI runs exactly this — see .github/workflows/ci.yml and README.md.

name: mica-oidc-test

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

    # Mica and the GitHub stub share this network namespace (see below), so
    # every port is published here.
    ports:
      - "127.0.0.1:5556:5556"
      - "127.0.0.1:6422:6422"
      - "127.0.0.1:8787:8787"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The repository: the example content, served the way GitHub's API serves it.
  github:
    image: node:24-alpine
    command: ["node", "/stub/server.mjs"]
    network_mode: "service:dex"
    depends_on:
      dex:
        condition: service_started
    volumes:
      - ../github-stub/server.mjs:/stub/server.mjs:ro
      - ../../examples/muster-consulting/content:/seed:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/repos/acme/site/git/ref/heads/main',{headers:{authorization:'Bearer x'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30

  mica:
    image: micacms/editor:ci
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      dex:
        condition: service_healthy
      github:
        condition: service_healthy

    # `localhost:5556` must mean the same issuer to Mica as to the test, or
    # the ID token's `iss` would not match what discovery returned.
    network_mode: "service:dex"

    environment:
      # Plain-HTTP discovery is allowed only outside production, and only for
      # a provider on localhost. Everything else is production-shaped.
      NODE_ENV: development
      LOG_LEVEL: info

      MICA_PUBLIC_URL: http://localhost:6422
      MICA_OIDC_ISSUER: http://localhost:5556/dex
      MICA_OIDC_CLIENT_ID: mica
      MICA_OIDC_CLIENT_SECRET: oidc-test-client-secret-not-for-production

      MICA_ADMIT_EMAILS: alice@gmail.com
      MICA_ADMIT_DOMAIN: muster-consulting.example

      REPOSITORY: github
      REPOSITORY_PROJECT: acme/site
      REPOSITORY_TOKEN: stub-token-not-for-production
      REPOSITORY_API_BASE: http://localhost:8787

      SESSION_SECRET: oidc-test-session-secret-00000000000

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6422/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
