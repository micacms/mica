# The automated OIDC test: the real Mica image against a real Dex, publishing
# to a real Git host (Forgejo) over HTTP.
#
#   docker compose -f tests/oidc/compose.yml up -d --build --wait
#   node --test tests/oidc/flow.test.mjs
#   docker compose -f tests/oidc/compose.yml down
#
# CI runs exactly this — see .github/workflows/ci.yml and README.md.

name: mica-oidc-test

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

    # Mica and Forgejo share this network namespace (see below), so every port
    # is published here.
    ports:
      - "127.0.0.1:5556:5556"
      - "127.0.0.1:6422:6422"
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The repository: a real Git host. Plain HTTP on localhost, which Mica
  # accepts only with NODE_ENV=development.
  forgejo:
    image: data.forgejo.org/forgejo/forgejo:15.0.9
    network_mode: "service:dex"
    depends_on:
      dex:
        condition: service_started
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__log__LEVEL: Warn
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/version"]
      interval: 2s
      timeout: 2s
      retries: 60

  # One user, one repository, the example content. Runs once.
  forgejo-seed:
    image: data.forgejo.org/forgejo/forgejo:15.0.9
    network_mode: "service:dex"
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/seed.sh"]
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_PASSWORD: Forgejo-test-password-not-for-production
    volumes:
      - forgejo-data:/data
      - ./forgejo-seed.sh:/seed.sh:ro
      - ../../examples/muster-consulting/content:/seed:ro

  mica:
    image: micacms/editor:ci
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      dex:
        condition: service_healthy
      forgejo-seed:
        condition: service_completed_successfully

    # `localhost:5556` must mean the same issuer to Mica as to the test, or
    # the ID token's `iss` would not match what discovery returned.
    network_mode: "service:dex"

    # Hardened like deploy/self-hosted/compose.yml, so that CI proves the image
    # runs this way. /data is the anonymous volume that the image declares.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

    environment:
      # Plain-HTTP discovery is allowed only outside production, and only for
      # a provider on localhost. Everything else is production-shaped.
      NODE_ENV: development
      MICA_LOG_LEVEL: info

      MICA_PUBLIC_URL: http://localhost:6422
      MICA_OIDC_ISSUER: http://localhost:5556/dex
      MICA_OIDC_CLIENT_ID: mica
      MICA_OIDC_CLIENT_SECRET: oidc-test-client-secret-not-for-production

      MICA_ADMIT_EMAILS: alice@gmail.com
      MICA_ADMIT_DOMAINS: muster-consulting.example
      # The flow test and the browser tests sign in about ten times from one address.
      MICA_SIGNIN_MAX_ATTEMPTS: "50"

      MICA_REPOSITORY_URL: http://localhost:3000/editor/site.git
      MICA_REPOSITORY_USERNAME: editor
      # Forgejo accepts the account password where a token would go.
      MICA_REPOSITORY_TOKEN: Forgejo-test-password-not-for-production

      MICA_SESSION_SECRET: oidc-test-session-secret-00000000000

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6422/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  forgejo-data:
