# Reference deployment.
#
#   cp apps/cms/.env.example .env   # fill in the secrets and the repository
#   pnpm build:schema               # mica.config.ts -> mica.config.json
#   docker compose up -d
#
# One container. No database server, no cache, no queue, no object storage —
# and, since content moved into Git, no content volume either.
#
# The image carries no content model. `mica.config.json` is mounted in, which is
# why the same published image serves any project — and why changing the model
# is a `pnpm build:schema` plus a restart, not a rebuild.
#
# There is no backup service any more. The content is in a Git repository, which
# is already replicated, versioned and off-site; the volume below holds accounts
# and sessions, and losing it signs everyone out and costs nothing else.

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: micacms/cms:1.0.0
    restart: unless-stopped

    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data

      # How this deployment reaches its content repository.
      #
      # `github` or `gitlab` is the normal choice for a container: it commits
      # through the provider's API, so there is no clone to keep in sync and no
      # deploy key on disk. Set REPOSITORY_PROJECT and REPOSITORY_TOKEN in .env.
      REPOSITORY: ${REPOSITORY:-github}

      # For REPOSITORY=local instead, mount a checkout at /content and set:
      #   REPOSITORY: local
      #   CONTENT_ROOT: /content

    ports:
      # Bound to loopback: put a reverse proxy in front for TLS. Change to
      # "4000:4000" only if the host itself is not reachable from the internet.
      - "127.0.0.1:4000:4000"

    volumes:
      # Accounts and sessions. Not the website — that is in the repository.
      - cms-data:/data
      # The project's content model. Read-only: the CMS is given a schema, it
      # never writes one. Rebuild with `pnpm build:schema` after editing
      # mica.config.ts, then `docker compose restart cms`.
      - ./mica.config.json:/app/schema.json:ro
      # For REPOSITORY=local only — a checkout of the content repository:
      # - ./content:/content

    healthcheck:
      # Checks both halves: the database that holds sessions, and the content
      # repository. A container that is listening but cannot reach its
      # repository cannot save anything, and should not be sent traffic.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cms-data:
