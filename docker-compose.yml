# Reference deployment.
#
#   cp apps/cms/.env.example .env   # fill in the secrets and the repository
#   docker compose up -d
#
# One container. No database server, no cache, no queue, no object storage —
# and, since content moved into Git, no content volume either.
#
# The image carries no content model: it reads one from the content repository,
# at `.mica/schema.json`, which the Astro project writes and the developer
# commits. That is why the same published image serves any project, and why
# changing the model is a commit plus a restart rather than a rebuild.
#
# There is no backup service any more. The content is in a Git repository, which
# is already replicated, versioned and off-site; the volume below holds accounts,
# memberships and sessions, and losing it signs everyone out and costs nothing
# else. It holds no passwords — Mica has none.

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: micacms/cms:0.1.0
    restart: unless-stopped

    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data

      # OIDC or nothing. `local` disables authentication, and Mica refuses to
      # start that way with NODE_ENV=production — set OIDC_ISSUER and
      # OIDC_CLIENT_ID in .env, and register
      # ${CMS_BASE_URL}/api/auth/callback with the provider.
      MICA_MODE: ${MICA_MODE:-self-hosted}

      # How this deployment reaches its content repository.
      #
      # `github` or `gitlab` is the normal choice for a container: it commits
      # through the provider's API, so there is no clone to keep in sync and no
      # deploy key on disk. Set REPOSITORY_PROJECT and REPOSITORY_TOKEN in .env.
      REPOSITORY: ${REPOSITORY:-github}

      # For REPOSITORY=local instead, mount a checkout at /content and set:
      #   REPOSITORY: local
      #   CONTENT_ROOT: /content

    ports:
      # Bound to loopback: put a reverse proxy in front for TLS. Change to
      # "6422:6422" only if the host itself is not reachable from the internet.
      - "127.0.0.1:6422:6422"

    volumes:
      # Accounts and sessions. Not the website — that is in the repository, and
      # so is the content model.
      - cms-data:/data
      # For REPOSITORY=local only — a checkout of the content repository:
      # - ./content:/content

    healthcheck:
      # Checks both halves: the database that holds sessions, and the content
      # repository. A container that is listening but cannot reach its
      # repository cannot save anything, and should not be sent traffic.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6422/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cms-data:
