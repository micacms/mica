name: Documentation
description: A guide or a reference page is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, or "missing".
      placeholder: https://mica.build/docs/…
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
