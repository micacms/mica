# Builds the public website and uploads the static output.
#
# A worked example, not a requirement: the CMS emits a generic signed webhook
# and works the same with GitLab CI, a Jenkins job or a shell script on a box
# under someone's desk (TRD §2.4).

name: Build website

on:
  # Content published in the CMS. Point BUILD_WEBHOOK_URL at a relay that
  # forwards to the GitHub dispatches API, or trigger this manually.
  repository_dispatch:
    types: [mica-publish]

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/build-site.yml"

  # A daily rebuild is cheap insurance: if a webhook were ever lost, the site is
  # never more than a day stale.
  schedule:
    - cron: "17 4 * * *"

concurrency:
  # A burst of publishes should produce one build, not a queue of them.
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      - name: Build the website
        env:
          CMS_URL: ${{ secrets.CMS_URL }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm --filter @micacms/web build

      - name: Check the output does not depend on the CMS
        env:
          CMS_URL: ${{ secrets.CMS_URL }}
        run: |
          host=$(printf '%s' "$CMS_URL" | sed -E 's#^https?://##; s#/.*##')
          if grep -rl "$host" apps/web/dist; then
            echo "::error::The build still references the CMS at $host — the site would not be self-contained."
            exit 1
          fi
          echo "Output is self-contained."

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/web/dist
          retention-days: 7

      # Replace with whatever hosts the site. The build above is
      # provider-agnostic; only this step is not.
      #
      # - name: Deploy
      #   run: npx wrangler pages deploy apps/web/dist --project-name=example
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
