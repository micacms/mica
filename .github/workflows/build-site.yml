# Builds the public website and uploads the static output.
#
# A worked example, not a requirement. The trigger is a push, because an editor
# pressing Save in Mica *is* a push — there is no webhook to receive, no secret
# to share and no relay to run. GitLab CI, a Jenkins job or a shell script on a
# box under someone's desk would work identically.

name: Build website

on:
  push:
    branches: [main]
    paths:
      # The content directory is what editors change. The rest is what
      # developers change. Both need a rebuild; nothing else does.
      - "examples/muster-consulting/**"
      - "packages/**"
      - "rush.json"
      - "common/config/rush/**"
      - ".github/workflows/build-site.yml"

  workflow_dispatch:

concurrency:
  # A burst of edits should produce one build, not a queue of them. This is what
  # the CMS's publish debounce used to do, in the place that can actually see
  # the queue.
  group: build-site
  cancel-in-progress: true

# Read-only by default; a job that needs more says so (#135).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.rush
            common/temp/pnpm-store
          key: rush-${{ runner.os }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-${{ runner.os }}-

      - run: node common/scripts/install-run-rush.js install --to @micacms/example-muster-consulting

      # No CMS_URL and no token: the content is in this checkout. The build
      # cannot be broken by the CMS being down, slow, or mid-deploy. `--to`
      # builds the shared packages first — they are the site's dependencies.
      - name: Build the website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node common/scripts/install-run-rush.js build --to @micacms/example-muster-consulting

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website
          path: examples/muster-consulting/dist
          retention-days: 7

      # Replace with whatever hosts the site. The build above is
      # provider-agnostic; only this step is not.
      #
      # - name: Deploy
      #   run: npx wrangler pages deploy examples/muster-consulting/dist --project-name=example
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
