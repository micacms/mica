# Builds the public website and uploads the static output.
#
# A worked example, not a requirement. The trigger is a push, because an editor
# pressing Save in Mica *is* a push — there is no webhook to receive, no secret
# to share and no relay to run. GitLab CI, a Jenkins job or a shell script on a
# box under someone's desk would work identically.

name: Build website

on:
  push:
    branches: [main]
    paths:
      # The content directory is what editors change. The rest is what
      # developers change. Both need a rebuild; nothing else does.
      - "sites/muster-consulting/**"
      - "packages/**"
      - ".github/workflows/build-site.yml"

  workflow_dispatch:

concurrency:
  # A burst of edits should produce one build, not a queue of them. This is what
  # the CMS's publish debounce used to do, in the place that can actually see
  # the queue.
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      # No CMS_URL and no token: the content is in this checkout. The build
      # cannot be broken by the CMS being down, slow, or mid-deploy.
      - name: Build the website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm --filter @micacms/example-muster-consulting build

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: sites/muster-consulting/dist
          retention-days: 7

      # Replace with whatever hosts the site. The build above is
      # provider-agnostic; only this step is not.
      #
      # - name: Deploy
      #   run: npx wrangler pages deploy sites/muster-consulting/dist --project-name=example
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
