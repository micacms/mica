# Publishing, from a tag.
#
#   rush version-bump          # or: rush release-version --version 0.2.0
#   git commit -am "Release 0.2.0" && git tag -a v0.2.0 -m "Release 0.2.0"
#   git push --atomic origin main v0.2.0
#
# The tag is the trigger and the only one: nothing publishes on a merge to
# main, so a release is a decision rather than a side effect of landing a pull
# request. `--atomic` pushes the commit and the tag together or neither.
#
# Everything here carries one version — every published package and the image
# — so the order is: check and build without any write right, then the image,
# then npm, then the GitHub release. What cannot be taken back (a version on
# npm) comes after everything that can still fail.

name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs.
permissions: {}

jobs:
  # Read-only: the dependencies' install and build scripts run here, so this job
  # holds no token that can push, publish or tag.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Rush installs its own pinned copy of itself and of pnpm; rush.json is
      # the only place versions live.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rush
            common/temp/pnpm-store
          key: rush-${{ runner.os }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-${{ runner.os }}-

      # The tag says one thing and the manifests or the changelog say another
      # exactly when somebody tags without running the release flow. Caught
      # here, that is a deleted tag; caught after a publish, it is a version on
      # npm that cannot be replaced.
      - name: Check the tag against the manifests and the changelog
        run: |
          node -e '
            const { readVersions, changelogSection } = await import("./scripts/version.mjs");
            const tag = process.argv[1];
            const wrong = readVersions().filter((entry) => entry.version !== tag);
            for (const entry of wrong) {
              console.error(`::error file=${entry.file}::${entry.file} says ${entry.version}, the tag says ${tag}`);
            }
            const notes = changelogSection(tag);
            if (!notes) console.error("::error file=CHANGELOG.md::No CHANGELOG section for this version.");
            if (wrong.length > 0 || !notes) process.exit(1);
            // Drop the heading: the release page already shows the version.
            const { mkdirSync, writeFileSync } = await import("node:fs");
            mkdirSync("release", { recursive: true });
            writeFileSync("release/release-notes.md", notes.split("\n").slice(1).join("\n").trim() + "\n");
          ' --input-type=module "${GITHUB_REF_NAME#v}"

      - run: node common/scripts/install-run-rush.js install

      # The same gate a pull request passes. A tag can be pushed to a commit CI
      # never saw — a hotfix branch, a manual tag — so the release re-runs it
      # rather than trusting that it happened.
      - run: node common/scripts/install-run-rush.js build
      - run: node common/scripts/install-run-rush.js typecheck
      - run: node common/scripts/install-run-rush.js test
      # The tarballs, installed in a copy of the starter, before anything is published (#128).
      - run: node scripts/pack-test.mjs

      # `rush publish --pack` packs every project marked `shouldPublish`, with
      # `workspace:*` ranges rewritten to the real versions. The npm job
      # publishes these files and runs no build of its own.
      - run: node common/scripts/install-run-rush.js publish --include-all --pack --publish --release-folder "$GITHUB_WORKSPACE/release/packages"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # The image carries the same version. Before npm, so that a failed image
  # build leaves nothing published.
  #
  # It goes to this repository's own container registry, which needs no account
  # and no secret: GITHUB_TOKEN is the credential. One manual step remains, once
  # for each package — a package is created private, and self-hosters cannot
  # pull it until it is made public under Packages → mica (and → preview, after
  # the first release that has it) → Package settings.
  image:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the container image
      id-token: write # the keyless signature

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulation for the arm64 runtime stage; install and build run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # A buildx builder with the docker-container driver: the default docker
      # driver cannot attach the SBOM and provenance attestations below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without the `v`: the tag is `v0.2.0`, the image is `:0.2.0`, and
      # deploy/self-hosted/compose.yml pins that number. A pre-release does not
      # move `:latest`.
      - name: The version, without the tag's `v`
        id: version
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "latest=" ;; *) echo "latest=ghcr.io/${GITHUB_REPOSITORY}:latest" ;; esac >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "preview_latest=" ;; *) echo "preview_latest=ghcr.io/${GITHUB_REPOSITORY_OWNER}/preview:latest" ;; esac >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # An SBOM and full build provenance, attached to the image (#133).
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ${{ steps.version.outputs.latest }}

      # Keyless: the signature names this workflow and this repository, through
      # GitHub's OIDC token, and is recorded in the public Rekor log.
      # The self-hosting guide on the website (sites/website/content/docs/self-hosting) has the verify command.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # The live preview's image (ADR 38): the second target of the same
      # Dockerfile, with the same version, attestations and signature.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: preview
        with:
          context: .
          target: preview
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/preview:${{ steps.version.outputs.value }}
            ${{ steps.version.outputs.preview_latest }}

      - name: Sign the preview image
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/preview@${{ steps.preview.outputs.digest }}"

  npm:
    runs-on: ubuntu-latest
    needs: [verify, image]
    timeout-minutes: 10
    # The approval step before anything is published (#135). Without a rule,
    # GitHub creates the environment on the first run and it gates nothing, so a
    # release cannot fail on a missing setting. Give it a required reviewer in
    # the repository settings once the repository is public.
    environment: release
    permissions:
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # Trusted publishing: with a trusted publisher set for each package on
      # npmjs.com (this repository, release.yml, environment `release`), npm
      # signs in with this job's OIDC token, and `NPM_TOKEN` can go. Until then
      # the token is used. Provenance needs a public repository: npm refuses it
      # for a private one with a 422, so it is asked for exactly when it can be
      # given. A version that is already on npm is skipped, so a release that
      # failed part of the way can run again. A pre-release (`v0.5.0-rc.1`)
      # goes under `next`, so `npm install` keeps getting the last release.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; *) tag=latest ;; esac
          provenance=
          if [ "$PRIVATE" = "false" ]; then provenance=--provenance; else echo "::notice::Private repository — publishing without provenance."; fi
          for file in packages/*.tgz; do
            name=$(tar -xOzf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            version=$(tar -xOzf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already."
              continue
            fi
            # "./": without it, npm reads `packages/<file>` as a GitHub repository and clones it.
            npm publish "./$file" --access public --tag "$tag" $provenance
          done

  github-release:
    runs-on: ubuntu-latest
    needs: npm
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub release

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          # A re-run after a partial failure updates the release instead of failing on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
          fi
