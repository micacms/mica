# Publishing, from a tag.
#
#   rush version-bump          # or: rush release-version --version 0.2.0
#   git commit -am "Release 0.2.0" && git tag v0.2.0
#   git push origin main --follow-tags
#
# The tag is the trigger and the only one: nothing publishes on a merge to
# main, so a release is a decision rather than a side effect of landing a pull
# request.
#
# Everything here carries one version — every published package and the image
# — so this publishes all of them together or none of them.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance
  packages: write # the container image

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The approval step before anything is published (#135). Without a rule,
    # GitHub creates the environment on the first run and it gates nothing, so a
    # release cannot fail on a missing setting. Give it a required reviewer in
    # the repository settings; a private repository on the free plan cannot.
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Rush installs its own pinned copy of itself and of pnpm; rush.json is
      # the only place versions live. Publishing authenticates through
      # common/config/rush/.npmrc-publish, not setup-node's registry file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rush
            common/temp/pnpm-store
          key: rush-${{ runner.os }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-${{ runner.os }}-

      # The tag says one thing and the manifests say another exactly when
      # somebody tags without running `release:version`. Caught here, that is a
      # deleted tag; caught after the publish, it is a version on npm that
      # cannot be replaced.
      - name: Check the tag against the manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const { readVersions } = await import("./scripts/version.mjs");
            const tag = process.argv[1];
            const wrong = readVersions().filter((entry) => entry.version !== tag);
            if (wrong.length === 0) process.exit(0);
            for (const entry of wrong) {
              console.error(`::error file=${entry.file}::${entry.file} says ${entry.version}, the tag says ${tag}`);
            }
            process.exit(1);
          ' --input-type=module "$tag"

      - run: node common/scripts/install-run-rush.js install

      # The same gate a pull request passes. A tag can be pushed to a commit CI
      # never saw — a hotfix branch, a manual tag — so the release re-runs it
      # rather than trusting that it happened.
      - run: node common/scripts/install-run-rush.js build
      - run: node common/scripts/install-run-rush.js typecheck
      - run: node common/scripts/install-run-rush.js test

      # Provenance is an attestation that these bytes were built by this
      # workflow from this commit, and npm will only verify one when it can
      # read the source repository — a private repo is rejected with a 422,
      # after the tests have passed and while the release looks like it is
      # working. So it is asked for exactly when it can be given, and this
      # starts signing releases by itself on the day the repository goes
      # public.
      # `rush publish --include-all` publishes every project marked
      # `shouldPublish` in rush.json, rewriting `workspace:*` ranges to the
      # real versions as pnpm used to. npm reads provenance from the
      # environment, so the flag survives Rush standing between us and it.
      # It skips a package whose version is already on npm, so a release that
      # failed part of the way can run again ("Re-run failed jobs").
      # A pre-release (`v0.5.0-rc.1`) goes under `next`, so `npm install`
      # keeps getting the last release.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = "false" ]; then
            export NPM_CONFIG_PROVENANCE=true
          else
            echo "::notice::Private repository — publishing without provenance."
          fi
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; *) tag=latest ;; esac
          node common/scripts/install-run-rush.js publish --include-all --publish --set-access-level public --tag "$tag"

      - name: Release notes from the changelog
        id: notes
        run: |
          node -e '
            const { changelogSection } = await import("./scripts/version.mjs");
            const notes = changelogSection(process.argv[1]);
            if (!notes) { console.error("::error::No CHANGELOG section for this version."); process.exit(1); }
            // Drop the heading: the release page already shows the version.
            console.log(notes.split("\n").slice(1).join("\n").trim());
          ' --input-type=module "${GITHUB_REF_NAME#v}" > release-notes.md
          cat release-notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          # A re-run after a partial failure: Rush skipped the packages already on
          # npm, and this updates the release instead of failing on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
          fi

  # The image carries the same version. Separate job so a registry outage cannot
  # un-publish npm.
  #
  # It goes to this repository's own container registry, which needs no account
  # and no secret: GITHUB_TOKEN is the credential. One manual step remains, once
  # — the package is created private, and self-hosters cannot pull it until it
  # is made public under Packages → mica → Package settings.
  image:
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emulation for the arm64 runtime stage; install and build run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # A buildx builder with the docker-container driver: the default docker
      # driver cannot attach the SBOM and provenance attestations below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without the `v`: the tag is `v0.2.0`, the image is `:0.2.0`, and
      # deploy/self-hosted/compose.yml pins that number. A pre-release does not
      # move `:latest`.
      - name: The version, without the tag's `v`
        id: version
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "latest=" ;; *) echo "latest=ghcr.io/${GITHUB_REPOSITORY}:latest" ;; esac >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # An SBOM and full build provenance, attached to the image (#133).
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ${{ steps.version.outputs.latest }}

      # Keyless: the signature names this workflow and this repository, through
      # GitHub's OIDC token, and is recorded in the public Rekor log.
      # docs/self-hosting.md has the verify command.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
