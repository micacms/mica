name: Live Git

# Runs apps/self-hosted/test/live.test.ts against scratch repositories on github.com and gitlab.com.
# Not on pull requests: a fork cannot read the secrets, and a host outage must not block a merge.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: live-git
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rush
            common/temp/pnpm-store
          key: rush-${{ runner.os }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-${{ runner.os }}-

      - run: node common/scripts/install-run-rush.js install --to @micacms/self-hosted
      - run: node common/scripts/install-run-rush.js build --to @micacms/self-hosted

      # A host without a token or repository is skipped, visibly in the log. The token must be
      # allowed to push to MICA_LIVE_BRANCH: on GitLab, a protected branch needs the Maintainer role.
      - name: Publish to the scratch repositories
        working-directory: apps/self-hosted
        env:
          MICA_LIVE_GITHUB_TOKEN: ${{ secrets.MICA_LIVE_GITHUB_TOKEN }}
          MICA_LIVE_GITHUB_REPO: ${{ vars.MICA_LIVE_GITHUB_REPO }}
          MICA_LIVE_GITLAB_TOKEN: ${{ secrets.MICA_LIVE_GITLAB_TOKEN }}
          MICA_LIVE_GITLAB_PROJECT: ${{ vars.MICA_LIVE_GITLAB_PROJECT }}
          MICA_LIVE_BRANCH: ${{ vars.MICA_LIVE_BRANCH }}
        run: node --test --import tsx test/live.test.ts
