# Builds the CMS image, scans it, and runs the OIDC and browser tests on it.
#
# Only for a pull request, or a push to main, that can change the image or
# these tests. A change to only docs, the website or the starter skips it.

name: Image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/**"
      - "apps/self-hosted/**"
      - "tests/oidc/**"
      - "tests/browser/**"
      - "tests/preview/**"
      - "rush.json"
      - "tsconfig.base.json"
      - "**/package.json"
      - "common/config/**"
      - "common/scripts/**"
      - "scripts/third-party-notices.*"
      - "scripts/api-report.mjs"
      - "scripts/api-extractor.base.json"
      - "scripts/licenses/**"
      # The test stack seeds its Git host with the example's content, and the preview runs the example site.
      - "examples/company-site/**"
      - ".github/workflows/image.yml"
  # Again on main after a merge, with the same paths (#304).
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/**"
      - "apps/self-hosted/**"
      - "tests/oidc/**"
      - "tests/browser/**"
      - "tests/preview/**"
      - "rush.json"
      - "tsconfig.base.json"
      - "**/package.json"
      - "common/config/**"
      - "common/scripts/**"
      - "scripts/third-party-notices.*"
      - "scripts/api-report.mjs"
      - "scripts/api-extractor.base.json"
      - "scripts/licenses/**"
      # The test stack seeds its Git host with the example's content, and the preview runs the example site.
      - "examples/company-site/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more says so (#135).
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No install and no build step: the image builds itself, and the content
      # model it needs is committed in the example project.
      - name: Build the CMS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: micacms/editor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release builds amd64 and arm64 after npm is published; a failure
      # there would cost a patch release, so both build here first.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build the CMS image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

      # Fails on a critical vulnerability that has a fix. One without a fix is
      # listed, not fatal: it would block every pull request until upstream acts.
      - name: Scan the CMS image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: micacms/editor:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The whole deployed shape, automated: the image just built, behind a
      # real Dex, publishing to a stand-in for the GitHub API. `--wait` is the
      # health check; the test then signs in, is admitted or refused, edits,
      # and publishes — see tests/oidc/README.md.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Start Mica behind Dex
        run: docker compose -f tests/oidc/compose.yml up -d --no-build --wait

      - name: Sign in, edit and publish
        run: node --test tests/oidc/flow.test.mjs

      # The same stack, driven by clicking through the editor UI in Chromium —
      # see tests/browser/README.md. Only this project's closure is installed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rush
            common/temp/pnpm-store
          key: rush-${{ runner.os }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-${{ runner.os }}-

      # The browser follows the Playwright version in the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}

      - name: Install the browser test
        run: |
          node common/scripts/install-run-rush.js install --to @micacms/browser-test
          cd tests/browser && ./node_modules/.bin/playwright install --with-deps chromium

      - name: Sign in, edit and publish in a browser
        working-directory: tests/browser
        run: ./node_modules/.bin/playwright test

      # The live preview of the self-hosted Mica (ADR 38): the example website's
      # astro dev in a container of its own, behind Mica's gate on another host
      # name — see tests/preview/README.md.
      - name: Start the live preview
        run: |
          docker compose -f tests/oidc/compose.yml -f tests/preview/compose.yml build preview
          docker compose -f tests/oidc/compose.yml -f tests/preview/compose.yml up -d --no-build --wait

      - name: The live preview in a browser
        working-directory: tests/browser
        env:
          MICA_PREVIEW_STACK: "1"
        run: ./node_modules/.bin/playwright test preview-self-hosted

      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/browser/playwright-report
          if-no-files-found: ignore

      - name: Logs of the test stack
        if: failure()
        run: docker compose -f tests/oidc/compose.yml -f tests/preview/compose.yml logs
