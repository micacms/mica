name: CI

# Pull requests only: a merge to main runs nothing again, and the release
# workflow runs the whole gate before it publishes.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more says so (#135).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `rush change --verify` compares against main, which needs the
          # history to be in the checkout.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Rush installs its own pinned copy of itself and of pnpm, so there is
      # no pnpm setup step — rush.json is the only place versions live. The
      # cache holds the pnpm store plus the Rush install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rush
            common/temp/pnpm-store
          key: rush-${{ runner.os }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-${{ runner.os }}-

      # `rush install` is frozen by definition: it refuses rather than update
      # the committed lockfile.
      - run: node common/scripts/install-run-rush.js install

      # A change to a published package must carry a change file — the entry
      # that will become its release notes. A refactor that should not be in
      # the notes still carries one, recorded with the bump type `none`.
      # A release pull request consumes the change files: its new version and
      # changelogs are the record, so the check would find none.
      - name: Check for a change file
        run: |
          policy=common/config/rush/version-policies.json
          if [ "$(git show origin/main:$policy | grep -m1 '"version"')" != "$(grep -m1 '"version"' $policy)" ]; then
            echo "The release version changes: this is a release, and it consumed the change files."
          else
            node common/scripts/install-run-rush.js change --verify
          fi

      # Fails on a high or critical advisory in what Mica ships; the websites'
      # findings are listed but do not fail. See scripts/audit.mjs.
      - name: Audit the shipped dependencies
        run: node scripts/audit.mjs

      - name: Build packages
        run: node common/scripts/install-run-rush.js build --to tag:packages

      # The licenses of the bundled packages require their notices; the image build writes its own.
      - name: Assert the editor bundle carries its third-party notices
        run: grep -q "This product includes the following third-party software" packages/editor-ui/dist/THIRD_PARTY_NOTICES.txt

      # The example website is included: its collection types come from files
      # in the repository, so nothing has to be running for `astro check`.
      - name: Typecheck
        run: node common/scripts/install-run-rush.js typecheck

      - name: Test
        run: node common/scripts/install-run-rush.js test

      # No CMS is started. The build reads its content directory directly,
      # which is the property worth protecting — if this step ever needs a
      # server again, something has regressed.
      - name: Build the example website
        env:
          SITE_URL: https://example.com
        run: node common/scripts/install-run-rush.js build --to @micacms/example-company-site

      - name: Assert the output is self-contained
        run: |
          if grep -rl "localhost:6422" examples/company-site/dist; then
            echo "::error::The static output references the CMS."
            exit 1
          fi

      # The build publishes the content model for Mica to read. A diff here
      # means someone changed a collection and did not commit the result, which
      # would leave a deployed Mica serving the previous model.
      - name: Assert the published content model is committed
        run: git diff --exit-code examples/company-site/content/.mica/schema.json

      - name: Check the example's content
        run: node apps/local-editor/dist/cli.js check examples/company-site/content

      # The public website is built here rather than only on Vercel, so that a
      # pull request fails on a broken site before it can reach main — Vercel
      # deploys whatever main contains, without consulting this workflow.
      - name: Build the website
        run: node common/scripts/install-run-rush.js build --to @micacms/site

      - name: Assert the website's published content model is committed
        run: git diff --exit-code sites/micacms/content/.mica/schema.json

      - name: Check the website's content
        run: node apps/local-editor/dist/cli.js check sites/micacms/content

      # The starter installs the published packages, so it is not built here; its
      # content and committed model are checked against this tree.
      - name: Check the starter's content
        run: node apps/local-editor/dist/cli.js check examples/starter/content

