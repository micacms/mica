name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/**" build

      # The example website is included: its collection types come from files
      # in the repository, so nothing has to be running for `astro check`.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

      # No CMS is started. The build reads its content directory directly,
      # which is the property worth protecting — if this step ever needs a
      # server again, something has regressed.
      - name: Build the example website
        env:
          SITE_URL: https://example.com
        run: pnpm --filter @micacms/example-muster-consulting build

      - name: Assert the output is self-contained
        run: |
          if grep -rl "localhost:6422" examples/muster-consulting/dist; then
            echo "::error::The static output references the CMS."
            exit 1
          fi

      # The build publishes the content model for Mica to read. A diff here
      # means someone changed a collection and did not commit the result, which
      # would leave a deployed Mica serving the previous model.
      - name: Assert the published content model is committed
        run: git diff --exit-code examples/muster-consulting/content/.mica/schema.json

      # The public website is built here rather than only on Vercel, so that a
      # pull request fails on a broken site before it can reach main — Vercel
      # deploys whatever main contains, without consulting this workflow.
      - name: Build the website
        run: pnpm --filter @micacms/site build

      - name: Assert the website's published content model is committed
        run: git diff --exit-code sites/micacms/content/.mica/schema.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # No install and no build step: the image builds itself, and the content
      # model it needs is committed in the example project.
      - name: Build the CMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: micacms/editor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check health
        run: |
          # Configured the way a real deployment is, because that is the thing
          # worth testing. The image is the self-hosted app, which has no
          # unauthenticated mode to fall back to: OIDC configuration is
          # mandatory, so this provides it.
          #
          # The issuer never has to answer: discovery is lazy, and happens on
          # the first sign-in rather than at startup. Nothing here signs in.
          #
          # An admission rule is required all the same. Mica refuses to start
          # without one, because a deployment that admits everybody its issuer
          # knows is a misconfiguration rather than a default — and this step is
          # where that refusal would be noticed if it ever stopped working.
          #
          # REPOSITORY defaults to `local`, so the container needs a content
          # directory to point at rather than a provider token. The content
          # model comes from `.mica/schema.json` inside it — the image ships
          # without one and refuses to start until it finds one.
          docker run -d --name cms \
            -e SESSION_SECRET=ci-session-secret-0000000000000000 \
            -e MICA_PUBLIC_URL=http://localhost:6422 \
            -e MICA_OIDC_ISSUER=https://id.example.com \
            -e MICA_OIDC_CLIENT_ID=mica-ci \
            -e MICA_ADMIT_GROUP=mica-editors \
            -e CONTENT_ROOT=/content \
            -v "$PWD/examples/muster-consulting/content:/content:ro" \
            -p 6422:6422 micacms/editor:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:6422/health && exit 0
            sleep 2
          done

          echo "::error::The container never became healthy."
          docker logs cms
          exit 1
