name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/**" build

      # The website is included: its collection types come from files in the
      # repository, so nothing has to be running for `astro check` to work.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

      # No CMS is started. The build reads `content/` directly, which is the
      # property worth protecting — if this step ever needs a server again,
      # something has regressed.
      - name: Build the website
        env:
          SITE_URL: https://example.com
        run: pnpm --filter @micacms/web build

      - name: Assert the output is self-contained
        run: |
          if grep -rl "localhost:4000" apps/web/dist; then
            echo "::error::The static output references the CMS."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the CMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: micacms/cms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check health
        run: |
          # REPOSITORY defaults to `local`, so the container needs a content
          # directory to point at rather than a provider token.
          docker run -d --name cms \
            -e SESSION_SECRET=ci-session-secret-0000000000000000 \
            -e CMS_BASE_URL=http://localhost:4000 \
            -e CONTENT_ROOT=/content \
            -v "$PWD/content:/content:ro" \
            -p 4000:4000 micacms/cms:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health && exit 0
            sleep 2
          done

          echo "::error::The container never became healthy."
          docker logs cms
          exit 1
