# Reference deployment.
#
#   curl -o compose.yml https://raw.githubusercontent.com/amuedespacher/micacms/main/deploy/self-hosted/compose.yml
#   curl -o .env https://raw.githubusercontent.com/amuedespacher/micacms/main/deploy/self-hosted/.env.example
#   $EDITOR .env                           # the repository, the provider, one secret
#   docker compose up -d
#
# Two files on a server, and no clone of this repository: the image is
# published, and the content model comes out of your content repository at
# runtime.
#
# One container. No database server, no cache, no queue, no object storage —
# and, since content moved into Git, no content volume either.
#
# The image carries no content model: it reads one from the content repository,
# at `.mica/schema.json`, which the Astro project writes and the developer
# commits. That is why the same published image serves any project, and why
# changing the model is a commit plus a restart rather than a rebuild.
#
# There is no backup service any more. The content is in a Git repository, which
# is already replicated, versioned and off-site; the volume below holds only
# unpublished drafts, and losing it loses those and nothing else. There are
# no accounts in it, and no passwords — Mica has neither.

services:
  mica:
    image: ghcr.io/amuedespacher/micacms:0.2.2
    restart: unless-stopped

    # Written from .env.example. Everything the deployment needs is in there.
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data

      # OIDC or nothing: this image has no unauthenticated mode. Set
      # MICA_OIDC_ISSUER and MICA_OIDC_CLIENT_ID in .env, and register
      # ${MICA_PUBLIC_URL}/api/auth/callback with the provider.
      #
      # Who may then edit is a separate answer, and also required: set
      # MICA_ADMIT_GROUP, MICA_ADMIT_DOMAIN, MICA_ADMIT_EMAILS or
      # MICA_ADMIT_SUBJECTS in .env.

      # How this deployment reaches its content repository.
      #
      # `github` or `gitlab` is required: Mica commits through the provider's
      # API, so there is no clone to keep in sync and no deploy key on disk.
      # `local` is refused. Set REPOSITORY_PROJECT and REPOSITORY_TOKEN in .env.
      REPOSITORY: ${REPOSITORY:-github}

    ports:
      # Bound to loopback: put a reverse proxy in front for TLS. Change to
      # "6422:6422" only if the host itself is not reachable from the internet.
      - "127.0.0.1:6422:6422"

    volumes:
      # Unpublished drafts. Not the website — that is in the repository, and so
      # is the content model.
      - mica-data:/data

    healthcheck:
      # Checks both halves: the database that holds drafts, and the content
      # repository. A container that is listening but cannot reach its
      # repository cannot save anything, and should not be sent traffic.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6422/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mica-data:
