# Reference deployment.
#
#   curl -o compose.yml https://raw.githubusercontent.com/micacms/mica/main/deploy/self-hosted/compose.yml
#   curl -o .env https://raw.githubusercontent.com/micacms/mica/main/deploy/self-hosted/.env.example
#   $EDITOR .env                           # the repository, the provider, one secret
#   docker compose run --rm mica check     # access, push rights and the content model
#   docker compose up -d
#
# Two files on a server, and no clone of this repository. One container: no database,
# no cache, no queue, no object storage. Mica keeps a clone of the content repository
# on the volume below and edits it there.
#
# The image carries no content model: it reads `.mica/schema.json` from the content
# repository, which the Astro project writes and the developer commits. So one published
# image serves any project, and a model change is a commit plus a restart, not a rebuild.
#
# There is no backup service. The published content is in a Git repository,
# which is already replicated, versioned and off-site. The volume holds the
# clone, and in it the drafts that are saved and not yet published: losing the
# volume loses those and nothing else. There are no accounts in it, and no
# passwords — Mica has neither. Run one Mica per volume: a second one on the
# same volume waits for the first to stop, then refuses to start.

services:
  mica:
    image: ghcr.io/micacms/mica:0.11.0
    restart: unless-stopped

    # Written from .env.example. Everything the deployment needs is in there.
    env_file: .env
    environment:
      MICA_DATA_DIR: /data

      # OIDC or nothing: this image has no unauthenticated mode. Set
      # MICA_OIDC_ISSUER and MICA_OIDC_CLIENT_ID in .env, and register
      # ${MICA_PUBLIC_URL}/api/auth/callback with the provider.
      #
      # Who may then edit is a separate answer, and also required: set
      # MICA_ADMIT_GROUPS, MICA_ADMIT_DOMAINS, MICA_ADMIT_EMAILS or
      # MICA_ADMIT_SUBJECTS in .env.

      # The content repository is MICA_REPOSITORY_URL, with
      # MICA_REPOSITORY_TOKEN, in .env. Mica clones it over HTTPS into /data,
      # fetches and fast-forwards on its own, and pushes each publication.

    ports:
      # Bound to loopback: put a reverse proxy in front for TLS. Change to
      # "6422:6422" only if the host itself is not reachable from the internet.
      - "127.0.0.1:6422:6422"

    volumes:
      # Mica's clone of the content repository, with the drafts in it. Size it
      # for about twice the content (the clone's objects plus its files).
      - mica-data:/data

    # Nothing but /data and /tmp is writable, and no capability is left. With
    # no-new-privileges below, the unprivileged `node` user stays that.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 512m

    healthcheck:
      # Liveness only: a repository outage must not restart the container.
      # /ready reports the clone, with reason codes, for a monitor.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6422/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mica-data:
