# Mica in its deployed shape, on your machine.
#
#   cp deploy/demo-identity/.env.example deploy/demo-identity/.env    # your repository and its token
#   docker compose -f deploy/demo-identity/compose.yml --env-file deploy/demo-identity/.env up --build
#
# What a self-hosted Mica consists of, and nothing more:
#
#   mica        Mica itself: one Node process, and its clone of your repository
#   pocket-id   the identity provider, with its own small database file
#
# Your content repository, on any Git host over HTTPS, is not in here, on purpose:
# Mica pushes to a repository you own, and CI builds the website from it without Mica.
#
# Nothing has to be configured. A seed job registers Mica in Pocket ID, creates the
# three demo people over its API, and prints a sign-in link for each of them.
#
# Deliberately local: plain HTTP, an encryption key and an API key that anybody
# can read. Do not copy it to a server — copy deploy/self-hosted/compose.yml,
# which is the reference deployment.

name: mica-demo

services:
  # ------------------------------------------------------------ identity
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.2
    environment:
      # Mica and your browser must reach the issuer at the *same* URL, or the
      # `iss` claim will not match what discovery returned.
      APP_URL: http://localhost:1411
      # Demo values that anybody can read. Generate your own: `openssl rand -base64 32`.
      ENCRYPTION_KEY: MicaDemoEncryptionKey32CharsXXXX
      # Lets the seed job call the admin API. It is how the demo needs no click.
      STATIC_API_KEY: mica-demo-api-key-not-for-production
      ANALYTICS_DISABLED: "true"

    # Mica's port is published here too: the CMS shares this container's network
    # namespace, so this is the only place either port can be exposed from.
    ports:
      - "127.0.0.1:1411:1411"
      - "127.0.0.1:6422:6422"

    volumes:
      - pocket-id-data:/app/data

    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Registers Mica as an OIDC client, creates alice, bob and mallory, and prints
  # a sign-in link for each. Runs once: a second start only says that it ran.
  # `docker compose run --rm seed-identity link alice` prints a fresh link.
  seed-identity:
    image: alpine:3.22
    depends_on:
      pocket-id:
        condition: service_healthy
    # Shares Pocket ID's network namespace, so this calls the instance by the one
    # name Pocket ID answers to.
    network_mode: "service:pocket-id"
    entrypoint: ["/bin/sh", "/opt/seed-identity.sh"]
    environment:
      POCKET_ID_URL: http://localhost:1411
      POCKET_ID_API_KEY: mica-demo-api-key-not-for-production
      CALLBACK_URL: http://localhost:6422/api/auth/callback
    volumes:
      - ./seed/seed-identity.sh:/opt/seed-identity.sh:ro
      - seed:/seed

  # ---------------------------------------------------------------- mica
  mica:
    # The release of this checkout (each release sets the tag). To run the code
    # of this checkout instead, swap it for the build block below and add
    # `--build` to `docker compose up`.
    image: ghcr.io/micacms/mica:0.16.2
    # build:
    #   context: ../..
    #   dockerfile: Dockerfile

    depends_on:
      seed-identity:
        condition: service_completed_successfully

    # Shares Pocket ID's network namespace, so `localhost:1411` means the same
    # thing here as it does in your browser.
    network_mode: "service:pocket-id"

    # Pocket ID generates the client secret and the subjects. The seed job
    # leaves them in the volume, MICA_ADMIT_SUBJECTS too; this entrypoint reads them first.
    entrypoint:
      - /sbin/tini
      - --
      - /bin/sh
      - -c
      - "set -a; . /seed/oidc.env; set +a; exec node dist/index.js"

    environment:
      # Plain-HTTP discovery is allowed for a provider on this machine. All else is the deployed shape.
      MICA_LOG_LEVEL: debug

      MICA_PUBLIC_URL: http://localhost:6422
      MICA_SESSION_SECRET: demo-session-secret-0000000000000

      MICA_OIDC_ISSUER: http://localhost:1411

      # Your repository, from deploy/demo-identity/.env.
      MICA_REPOSITORY_URL: ${MICA_REPOSITORY_URL:?set MICA_REPOSITORY_URL in deploy/demo-identity/.env}
      MICA_REPOSITORY_TOKEN: ${MICA_REPOSITORY_TOKEN:?set MICA_REPOSITORY_TOKEN in deploy/demo-identity/.env}
      MICA_REPOSITORY_BRANCH: ${MICA_REPOSITORY_BRANCH:-main}

      MICA_DATA_DIR: /data

    volumes:
      - seed:/seed:ro
      - mica-data:/data

volumes:
  pocket-id-data:
  mica-data:
  # The client secret and the admission list that the seed job made for this demo.
  seed:
