# Mica in its deployed shape, on your machine.
#
#   cp deploy/demo-identity/.env.example deploy/demo-identity/.env    # your repository and its token
#   docker compose -f deploy/demo-identity/compose.yml --env-file deploy/demo-identity/.env up --build
#
# What a self-hosted Mica consists of, and nothing more:
#
#   mica        Mica itself: one Node process, and its clone of your repository
#   zitadel     the identity provider, with its database
#
# Your content repository, on any Git host over HTTPS, is not in here, on purpose:
# Mica pushes to a repository you own, and CI builds the website from it without Mica.
#
# Nothing has to be clicked. ZITADEL generates its own credentials on first boot,
# so a seed job registers Mica and creates the three demo people over ZITADEL's API.
#
# Deliberately local: plain HTTP, passwords in this file, a master key anybody
# can read. Do not copy it to a server — copy deploy/self-hosted/compose.yml,
# which is the reference deployment.

name: mica-demo

services:
  # ------------------------------------------------------------ identity
  zitadel:
    image: ghcr.io/zitadel/zitadel:v3.4.15
    command: >
      start-from-init
      --masterkey "MicaDemoMasterkey32CharactersXX"
      --tlsMode disabled
    depends_on:
      db:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully

    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable

      # Mica and your browser must reach the issuer at the *same* URL, or the
      # `iss` claim will not match what discovery returned.
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: false

      # The console account, for looking around: admin, Admin-Demo1.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Admin-Demo1
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false

      # A service account whose token ZITADEL writes to the shared volume. The
      # seed job uses it to register Mica and create the demo people.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: seed
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Demo seed
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: 2100-01-01T00:00:00Z
      ZITADEL_FIRSTINSTANCE_PATPATH: /seed/zitadel.pat

    # Mica's port is published here too: the CMS shares this container's network
    # namespace, so this is the only place either port can be exposed from.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6422:6422"

    volumes:
      - seed:/seed

  db:
    image: postgres:17-alpine
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "zitadel", "-U", "postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s
    volumes:
      - db-data:/var/lib/postgresql/data

  # ZITADEL runs unprivileged and writes its service-account token into the
  # shared volume, which Docker creates owned by root. One chmod, once.
  prepare:
    image: alpine:3.22
    command: ["/bin/sh", "-c", "chmod 0777 /seed"]
    volumes:
      - seed:/seed

  # Registers Mica as an OIDC application and creates alice, bob and mallory.
  # Runs once: it stops at the first line if it has run before.
  seed-identity:
    image: alpine:3.22
    depends_on:
      zitadel:
        condition: service_started
    # Shares ZITADEL's network namespace, so this calls the instance by the one
    # name ZITADEL answers to.
    network_mode: "service:zitadel"
    command: ["/bin/sh", "/opt/seed-identity.sh"]
    environment:
      ZITADEL_URL: http://localhost:8080
      CALLBACK_URL: http://localhost:6422/api/auth/callback
    volumes:
      - ./seed/seed-identity.sh:/opt/seed-identity.sh:ro
      - seed:/seed

  # ---------------------------------------------------------------- mica
  mica:
    # The release of this checkout (each release sets the tag). To run the code
    # of this checkout instead, swap it for the build block below and add
    # `--build` to `docker compose up`.
    image: ghcr.io/micacms/mica:0.8.0
    # build:
    #   context: ../..
    #   dockerfile: Dockerfile

    depends_on:
      seed-identity:
        condition: service_completed_successfully

    # Shares ZITADEL's network namespace, so `localhost:8080` means the same
    # thing here as it does in your browser.
    network_mode: "service:zitadel"

    # ZITADEL generates the client credentials and the subjects on first boot. The seed job
    # leaves them in the volume, MICA_ADMIT_SUBJECTS too; this entrypoint reads them first.
    entrypoint:
      - /sbin/tini
      - --
      - /bin/sh
      - -c
      - "set -a; . /seed/oidc.env; set +a; exec node dist/index.js"

    environment:
      # Development, on purpose: Mica refuses plain-HTTP OIDC discovery under NODE_ENV=production,
      # and a certificate for ZITADEL is too much for a local rig. All else is the deployed shape.
      NODE_ENV: development
      MICA_LOG_LEVEL: debug

      MICA_PUBLIC_URL: http://localhost:6422
      MICA_SESSION_SECRET: demo-session-secret-0000000000000

      MICA_OIDC_ISSUER: http://localhost:8080

      # Your repository, from deploy/demo-identity/.env.
      MICA_REPOSITORY_URL: ${MICA_REPOSITORY_URL:?set MICA_REPOSITORY_URL in deploy/demo-identity/.env}
      MICA_REPOSITORY_TOKEN: ${MICA_REPOSITORY_TOKEN:?set MICA_REPOSITORY_TOKEN in deploy/demo-identity/.env}
      MICA_REPOSITORY_ROOT: ${MICA_REPOSITORY_ROOT:-content}
      MICA_REPOSITORY_BRANCH: ${MICA_REPOSITORY_BRANCH:-main}

      MICA_DATA_DIR: /data

    volumes:
      - seed:/seed:ro
      - mica-data:/data

volumes:
  db-data:
  mica-data:
  # The credentials ZITADEL generated for this demo.
  seed:
